<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>RICHMAN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0b0b0d; --bg2:#141418; --card:#1a1a20; --card2:#22222a; --line:#2d2d38;
  --gold:#f5c542; --gold2:#b8860b; --goldsoft:#ffe08a; --text:#f4f1ea; --mute:#9a9aa8;
  --red:#d62839; --green:#1faa59; --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{background:radial-gradient(900px 500px at 50% -150px,#2b2208 0%,var(--bg) 60%) no-repeat,var(--bg)}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:0 16px calc(96px + env(safe-area-inset-bottom));}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:active{transform:scale(.97)}
.no-anim *{animation:none!important;transition:none!important}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 12px;position:sticky;top:0;z-index:5;
  background:linear-gradient(var(--bg) 70%,transparent)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--card2);
  border:3px solid var(--frame,var(--gold));box-shadow:0 0 14px color-mix(in srgb,var(--frame,var(--gold)) 45%,transparent);flex:none}
.avatar.big{width:84px;height:84px;font-size:46px}
.who{flex:1;min-width:0}
.who b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--mute);font-size:13px}
.bal{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px 7px 8px;font-weight:700;font-size:16px}
.bal.pulse{animation:pulse .7s ease}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,197,66,.7)}100%{box-shadow:0 0 0 18px rgba(245,197,66,0)}}

/* chip */
.chip{width:26px;height:26px;border-radius:50%;flex:none;position:relative;
  background:radial-gradient(circle at 35% 30%,#fff3b8,var(--gold) 45%,var(--gold2));
  box-shadow:0 2px 6px rgba(0,0,0,.6),0 0 10px rgba(245,197,66,.35)}
.chip::after{content:"";position:absolute;inset:4px;border-radius:50%;border:2px dashed rgba(60,40,0,.65)}
.chip.lg{width:48px;height:48px}.chip.lg::after{inset:7px}

h1{font-size:26px;margin:6px 0 4px}
h2{font-size:19px;margin:22px 0 12px}
.sub{color:var(--mute);font-size:15px;line-height:1.4}
.card{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.hero{background:linear-gradient(135deg,#3a2c06,#17130a 60%,#1a1a20);border-color:#5a4410;position:relative;overflow:hidden}
.hero .big{display:flex;align-items:center;gap:12px;font-size:36px;font-weight:800;color:var(--goldsoft);margin:6px 0 12px;text-shadow:0 0 18px rgba(245,197,66,.4)}
.bar{height:10px;background:#0c0c10;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:99px;transition:width .5s}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--mute);margin-bottom:6px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:16px;font-weight:700;font-size:17px;
  background:linear-gradient(180deg,var(--goldsoft),var(--gold) 50%,var(--gold2));color:#1b1300;box-shadow:0 6px 20px rgba(245,197,66,.25)}
.btn.sec{background:var(--card2);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:#3a1015;color:#ff9aa2;border:1px solid #6b1c25;box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none;box-shadow:none}
.btn.sm{min-height:42px;font-size:15px;width:auto;padding:0 16px}

.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.game{flex:none;width:200px;scroll-snap-align:start;border-radius:var(--radius);padding:14px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);text-align:left;position:relative;overflow:hidden}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .game{width:auto}
.game .ic{font-size:38px;margin-bottom:8px;display:block}
.game b{display:block;font-size:17px}
.game small{color:var(--mute);font-size:13px;line-height:1.3;display:block;margin-top:4px}
.badge{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:#2a2a33;color:var(--mute)}
.badge.go{background:var(--gold);color:#1b1300}
.game.feature{width:auto;display:flex;gap:14px;align-items:center;border-color:#5a4410;background:linear-gradient(135deg,#2c2208,var(--card))}
.wheel{width:78px;height:78px;border-radius:50%;flex:none;border:4px solid var(--gold);
  background:radial-gradient(circle,#0b0b0d 0 22%,transparent 23%),
  conic-gradient(var(--green) 0 9.7deg,var(--red) 0 19.4deg,#111 0 29.1deg,var(--red) 0 38.8deg,#111 0 48.5deg,var(--red) 0 58.2deg,#111 0 67.9deg,var(--red) 0 77.6deg,#111 0 87.3deg,var(--red) 0 97deg,#111 0 106.7deg,var(--red) 0 116.4deg,#111 0 126.1deg,var(--red) 0 135.8deg,#111 0 145.5deg,var(--red) 0 155.2deg,#111 0 164.9deg,var(--red) 0 174.6deg,#111 0 184.3deg,var(--red) 0 194deg,#111 0 203.7deg,var(--red) 0 213.4deg,#111 0 223.1deg,var(--red) 0 232.8deg,#111 0 242.5deg,var(--red) 0 252.2deg,#111 0 261.9deg,var(--red) 0 271.6deg,#111 0 281.3deg,var(--red) 0 291deg,#111 0 300.7deg,var(--red) 0 310.4deg,#111 0 320.1deg,var(--red) 0 329.8deg,#111 0 339.5deg,var(--red) 0 349.2deg,#111 0 360deg);
  box-shadow:0 0 20px rgba(245,197,66,.3);animation:spin 18s linear infinite}
.wheel.lg{width:180px;height:180px;margin:10px auto}
@keyframes spin{to{transform:rotate(360deg)}}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border-radius:14px;padding:12px}
.stat b{display:block;font-size:20px;color:var(--goldsoft)}
.stat span{font-size:13px;color:var(--mute)}

.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:16px}
.item .tx small{color:var(--mute);font-size:13px}
.price{display:flex;align-items:center;gap:6px}
.swatch{width:44px;height:44px;border-radius:50%;border:4px solid var(--c);background:var(--card2);flex:none;box-shadow:0 0 12px color-mix(in srgb,var(--c) 50%,transparent)}
.ava{width:44px;height:44px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:24px;flex:none;border:1px solid var(--line)}

.sw{width:58px;height:34px;border-radius:99px;background:#2a2a33;position:relative;transition:.2s;flex:none;border:1px solid var(--line)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#888;transition:.2s}
.sw.on{background:var(--gold2)}.sw.on::after{left:27px;background:var(--goldsoft)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(14,14,17,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--mute);border-radius:12px}
nav button span{font-size:22px;filter:grayscale(1) opacity(.7)}
nav button.on{color:var(--gold)}nav button.on span{filter:none}

#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#2a2a33;color:var(--text);
  border:1px solid var(--gold2);padding:12px 18px;border-radius:14px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
#modal.show{display:flex}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;width:100%;max-width:380px}
#modal h3{margin:0 0 10px}
#modal input{width:100%;font:inherit;font-size:17px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--text);margin-bottom:14px;-webkit-user-select:text;user-select:text}
#modal .acts{display:flex;gap:10px}
.list li{margin-bottom:8px;color:var(--mute);line-height:1.4}
.list{padding-left:20px;margin:0}

/* ===== игры ===== */
.bal small{color:var(--mute);font-size:12px;font-weight:600;margin-left:-2px}
.resmsg{min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:17px;margin:8px 0;color:var(--text);line-height:1.3}
.resmsg.win{color:var(--goldsoft);text-shadow:0 0 14px rgba(245,197,66,.5)}
.resmsg.lose{color:#ff8a94}
.betbox.locked,.locked{opacity:.5;pointer-events:none}
.betrow{display:flex;gap:8px;margin-bottom:8px}
.betrow input,.autoin{flex:1;min-width:0;text-align:center;font:inherit;font-size:22px;font-weight:800;color:var(--goldsoft);background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px;-webkit-user-select:text;user-select:text}
.autoin{font-size:18px;width:110px;flex:none}
.presets{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pbtn{min-height:46px;min-width:48px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:15px}
.pbtn.on{background:var(--gold);color:#1b1300;border-color:var(--gold)}
.autorow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.autorow b{font-size:16px}

.reels{display:flex;gap:10px;justify-content:center;padding:18px 10px;border-radius:var(--radius);background:linear-gradient(160deg,#2c2208,#121216);border:2px solid var(--gold2);box-shadow:inset 0 0 30px rgba(0,0,0,.6),0 0 24px rgba(245,197,66,.18);position:relative;margin:12px 0}
.reels::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:2px;background:rgba(245,197,66,.35);pointer-events:none}
.reel{width:30%;max-width:100px;height:110px;border-radius:14px;background:linear-gradient(#0d0d10,#1c1c22 50%,#0d0d10);border:1px solid var(--line);display:grid;place-items:center;font-size:56px;overflow:hidden}
.reel.spin span{filter:blur(2px);animation:jit .12s linear infinite}
@keyframes jit{50%{transform:translateY(6px)}}
.reel.stop{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.08)}}
.reel.win{border-color:var(--gold);box-shadow:0 0 20px rgba(245,197,66,.7)}
.pay{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:17px}
.pay:last-child{border:0}.pay b{color:var(--goldsoft)}

.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.hb{padding:5px 10px;border-radius:99px;background:var(--card2);font-weight:700;font-size:14px;border:1px solid var(--line)}
.hb.win,.hb.g{color:#5be38f}.hb.lose,.hb.r{color:#ff8a94}.hb.push{color:var(--goldsoft)}
.hb.red{background:var(--red);color:#fff}.hb.black{background:#000;color:#fff}.hb.green{background:var(--green);color:#fff}
.hrow{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--mute)}
.hrow:last-child{border:0}.hrow span:first-child{color:var(--text)}
.pos{color:#5be38f}.neg{color:#ff8a94}

.crashbox{position:relative;border-radius:var(--radius);overflow:hidden;background:#0e0e12;border:1px solid var(--line);margin:12px 0}
.crashbox canvas{display:block;width:100%;height:auto}
.cmult{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;font-size:54px;font-weight:900;color:var(--goldsoft);text-shadow:0 0 24px rgba(245,197,66,.5)}
.cmult.crashed{color:#ff4d5e;text-shadow:0 0 24px rgba(255,77,94,.5)}
.cmult.won{color:#5be38f;text-shadow:0 0 24px rgba(91,227,143,.4)}
.cmult small{font-size:15px;font-weight:600;color:var(--mute);text-shadow:none;margin-top:2px}

.wheelwrap{position:relative;width:min(300px,84vw);aspect-ratio:1;margin:10px auto}
.wheelrot,.ballrot{position:absolute;inset:0;transition:transform 5s cubic-bezier(.12,.6,.1,1)}
.wheelrot canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 0 30px rgba(245,197,66,.3);display:block}
.ballrot{pointer-events:none}
.ball{position:absolute;top:6%;left:50%;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#bbb);box-shadow:0 0 6px #000}
.hub{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(#1c1c22,#0b0b0d);border:3px solid var(--gold);display:grid;place-items:center;font-size:28px;font-weight:900;color:var(--goldsoft)}
.hub.red{color:#ff5a68}.hub.black{color:#fff}.hub.green{color:#38d97f}
.pointer{position:absolute;left:50%;top:-8px;margin-left:-11px;width:0;height:0;border:11px solid transparent;border-top:20px solid var(--gold);z-index:3;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7))}
.rg{display:grid;gap:6px;margin-bottom:8px}
.rg.n3{grid-template-columns:repeat(3,1fr)}
.rcell{position:relative;min-height:46px;border-radius:10px;display:grid;place-items:center;align-content:center;font-weight:800;font-size:17px;border:1px solid rgba(255,255,255,.12);color:#fff;padding:0}
.rcell.red{background:#a8202d}.rcell.black{background:#16161b}.rcell.green{background:#12753f}.rcell.out{background:var(--card2)}
.rcell small{font-size:12px;font-weight:600;opacity:.75;line-height:1}
.rcell .cb{position:absolute;top:-7px;right:-4px;min-width:24px;height:24px;padding:0 5px;border-radius:99px;background:radial-gradient(circle at 35% 30%,#fff3b8,var(--gold) 50%,var(--gold2));color:#1b1300;font-size:11px;font-weight:800;display:none;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.6);z-index:2}
.rcell.has .cb{display:flex}
.rcell.hit{outline:3px solid var(--goldsoft);animation:pulse .9s ease 2}
.rctl{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));z-index:6;background:rgba(20,20,24,.97);border:1px solid var(--gold2);border-radius:var(--radius);padding:10px 12px;margin-top:12px;box-shadow:0 -8px 24px rgba(0,0,0,.6)}
.rctl .presets{grid-template-columns:repeat(5,1fr);margin-bottom:8px}
.rctl .pbtn{min-height:42px}
.rctl .acts{display:grid;grid-template-columns:48px 48px 48px 1fr;gap:8px}
.rctl .acts .btn{min-height:46px;font-size:16px}
</style>
</head>
<body>
<div id="app"></div>
<nav><div class="in" id="nav"></div></nav>
<div id="toast"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>

<script>
"use strict";
/* ==========================================================
   RICHMAN v0.2 — структура файла (всё в одном index.html):
   1. Config      — настройки и данные (задания, магазин, игры)
   2. Storage     — сохранение (сейчас localStorage; позже сервер)
   3. State/Economy — баланс, опыт, уровни (ВСЕ изменения фишек только тут)
   4. Daily/Quests/Shop — игровые системы
   5. Sound       — звук и музыка
   6. UI          — экраны, навигация, события
   Новая игра = новая запись в GAMES + свой экран в Screens.
   Только виртуальные фишки. Реальных денег в игре нет.
   ========================================================== */

/* ---------- 1. Config ---------- */
const CONFIG = {
  saveKey: "richman.save.v1",
  startBalance: 1000,   // RC для нового игрока
  dailyCooldownMs: 24 * 60 * 60 * 1000,
  dailyStreakResetMs: 48 * 60 * 60 * 1000,
  dailyBase: 100, dailyStep: 50, dailyMaxStreak: 7,
  maxBalance: 1e12
};
const GAMES = [
  {id:"roulette", name:"Европейская рулетка", icon:"🎡", desc:"Числа 0–36: цвет, чёт/нечет, диапазоны, числа", status:"live"},
  {id:"slots",    name:"Слоты", icon:"🎰", desc:"3 барабана, выплаты до ×500", status:"live"},
  {id:"crash",    name:"Crash", icon:"🚀", desc:"Забери выигрыш до обвала", status:"live"},
  {id:"poker",    name:"Покер Hold'em", icon:"♠️", desc:"Против ботов", status:"soon"},
  {id:"fortune",  name:"Колесо удачи", icon:"🎯", desc:"Крути и получай призы", status:"soon"},
  {id:"durak",    name:"Дурак", icon:"🃏", desc:"Карточная игра с ботами", status:"soon"}
];
const QUESTS = [
  {id:"daily", t:"Забрать ежедневную награду", goal:1, chips:50, xp:30},
  {id:"casino", t:"Заглянуть в казино", goal:1, chips:25, xp:15},
  {id:"shop", t:"Посетить магазин", goal:1, chips:25, xp:15},
  {id:"round", t:"Сыграть 3 раунда в любых играх", goal:3, chips:100, xp:50}
];
const SHOP = [
  {id:"av_hat", type:"avatar", name:"Цилиндр", icon:"🎩", price:0},
  {id:"av_lion", type:"avatar", name:"Лев", icon:"🦁", price:150},
  {id:"av_wolf", type:"avatar", name:"Волк", icon:"🐺", price:250},
  {id:"av_eagle", type:"avatar", name:"Орёл", icon:"🦅", price:400},
  {id:"av_shades", type:"avatar", name:"Босс", icon:"🕶️", price:600},
  {id:"av_dragon", type:"avatar", name:"Дракон", icon:"🐉", price:1000},
  {id:"av_gem", type:"avatar", name:"Бриллиант", icon:"💎", price:1500},
  {id:"av_crown", type:"avatar", name:"Корона", icon:"👑", price:2500},
  {id:"fr_gold", type:"frame", name:"Золотая рамка", color:"#f5c542", price:0},
  {id:"fr_emerald", type:"frame", name:"Изумруд", color:"#1faa59", price:200},
  {id:"fr_ruby", type:"frame", name:"Рубин", color:"#e63946", price:350},
  {id:"fr_sapphire", type:"frame", name:"Сапфир", color:"#3a86ff", price:500},
  {id:"fr_violet", type:"frame", name:"Аметист", color:"#b266ff", price:800},
  {id:"fr_white", type:"frame", name:"Платина", color:"#e8eef5", price:1200}
];

/* ---------- 2. Storage (заменяемый слой) ---------- */
/* Сейчас данные лежат на устройстве (localStorage). Это НЕ защищённая серверная система:
   пользователь может изменить такие данные. Для общих аккаунтов позже заменим этот объект
   на запросы к серверу — остальной код менять не придётся. */
const Storage = {
  load(){ try{ const r = localStorage.getItem(CONFIG.saveKey); return r ? JSON.parse(r) : null; }catch(e){ return null; } },
  save(data){ try{ localStorage.setItem(CONFIG.saveKey, JSON.stringify(data)); return true; }catch(e){ return false; } },
  clear(){ try{ localStorage.removeItem(CONFIG.saveKey); }catch(e){} }
};

/* ---------- 3. State / Economy ---------- */
const tg = (window.Telegram && window.Telegram.WebApp) || null;
const todayKey = () => { const d = new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); };

function defaultState(){
  let name = "Игрок";
  try{ if(tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) name = String(tg.initDataUnsafe.user.first_name).slice(0,16); }catch(e){}
  return {
    v:1, name, balance:CONFIG.startBalance, level:1, xp:0, createdAt:Date.now(),
    stats:{rounds:0, wins:0, biggestWin:0, wagered:0},
    lastDaily:0, streak:0, lastBet:10, pending:null,
    history:{slots:[],crash:[],roulette:[]},
    quests:{day:todayKey(), progress:{}, claimed:{}},
    owned:["av_hat","fr_gold"], equipped:{avatar:"av_hat", frame:"fr_gold"},
    settings:{sound:true, music:false, animations:true, haptics:true}
  };
}
function isInt(n,min){ return Number.isSafeInteger(n) && n>=min; }
function cleanInfo(i){
  i = (i && typeof i==="object") ? i : {};
  return {b:String(i.b||"").slice(0,24), c:String(i.c||"").replace(/[^a-z]/g,"").slice(0,8), d:String(i.d||"").slice(0,40),
          n:isInt(i.n,0)&&i.n<=36?i.n:0, m:(typeof i.m==="number"&&isFinite(i.m)&&i.m>=0&&i.m<=1000)?i.m:0,
          crash:(typeof i.crash==="number"&&isFinite(i.crash)&&i.crash>=1&&i.crash<=1000)?i.crash:1};
}
function cleanHistory(h){
  const out = {};
  ["slots","crash","roulette"].forEach(g=>{
    const a = (h && Array.isArray(h[g])) ? h[g] : [];
    out[g] = a.slice(0,20).filter(e=>e && typeof e==="object").map(e=>({bet:isInt(e.bet,0)?e.bet:0, payout:isInt(e.payout,0)?e.payout:0,
      b:String(e.b||"").slice(0,24), c:String(e.c||"").replace(/[^a-z]/g,"").slice(0,8), d:String(e.d||"").slice(0,40)}));
  });
  return out;
}
function cleanPending(p){
  if(!p || typeof p!=="object" || !isInt(p.bet,1)) return null;
  if(p.game==="slots" || p.game==="roulette"){
    if(!isInt(p.payout,0)) return null;
    return {game:p.game, bet:p.bet, payout:p.payout, info:cleanInfo(p.info)};
  }
  if(p.game==="crash"){
    if(!(typeof p.crashPoint==="number" && p.crashPoint>=1 && p.crashPoint<=1000) || !isInt(p.startAt,0)) return null;
    const a = (typeof p.auto==="number" && p.auto>=1.01 && p.auto<=1000) ? p.auto : 0;
    return {game:"crash", bet:p.bet, crashPoint:p.crashPoint, startAt:Math.min(p.startAt,Date.now()), auto:a};
  }
  return null;
}
function sanitize(raw){
  const d = defaultState();
  if(!raw || typeof raw!=="object") return d;
  const s = Object.assign({}, d, raw);
  s.stats = Object.assign({}, d.stats, raw.stats||{});
  s.settings = Object.assign({}, d.settings, raw.settings||{});
  s.quests = Object.assign({}, d.quests, raw.quests||{});
  s.quests.progress = s.quests.progress||{}; s.quests.claimed = s.quests.claimed||{};
  s.equipped = Object.assign({}, d.equipped, raw.equipped||{});
  s.owned = Array.isArray(raw.owned) ? raw.owned.filter(x=>typeof x==="string") : d.owned;
  ["av_hat","fr_gold"].forEach(x=>{ if(!s.owned.includes(x)) s.owned.push(x); });
  if(!s.owned.includes(s.equipped.avatar)) s.equipped.avatar="av_hat";
  if(!s.owned.includes(s.equipped.frame)) s.equipped.frame="fr_gold";
  if(!isInt(s.balance,0) || s.balance>CONFIG.maxBalance) s.balance = d.balance;
  s.lastBet = isInt(s.lastBet,1) ? Math.min(s.lastBet,999999999) : 10;
  s.history = cleanHistory(raw.history);
  s.pending = cleanPending(raw.pending);
  if(!isInt(s.level,1)) s.level=1;
  if(!isInt(s.xp,0)) s.xp=0;
  if(!isInt(s.streak,0)) s.streak=0;
  if(!isInt(s.lastDaily,0) || s.lastDaily>Date.now()) s.lastDaily = s.lastDaily>Date.now()? Date.now() : 0;
  if(typeof s.name!=="string" || !s.name.trim()) s.name=d.name;
  s.name = s.name.slice(0,16);
  return s;
}
let S = sanitize(Storage.load());
const save = () => Storage.save(S);

const Economy = {
  can(n){ return isInt(n,1) && S.balance >= n; },
  /* списать фишки (покупка и т.п.). Возвращает true только если списание прошло */
  spend(n){
    if(!isInt(n,1) || S.balance < n) return false;
    S.balance -= n; S.stats.wagered += n; save(); return true;
  },
  /* начислить фишки (награды) */
  earn(n){
    if(!isInt(n,1)) return false;
    S.balance = Math.min(CONFIG.maxBalance, S.balance + n);
    save(); ui.pulse = true; return true;
  },
  /* НАЧАТЬ раунд: ставка списывается ровно один раз. Пока раунд не завершён, начать другой нельзя. */
  begin(game, bet, data){
    if(S.pending) return false;
    if(!isInt(bet,1) || bet > S.balance) return false;
    S.balance -= bet; S.stats.wagered += bet;
    S.pending = Object.assign({game, bet}, data||{});
    save(); refreshTop(); return true;
  },
  /* ЗАВЕРШИТЬ раунд: выплата начисляется ровно один раз (повторный вызов вернёт null) */
  settle(payout, info){
    const p = S.pending; if(!p) return null;
    S.pending = null;
    payout = isInt(payout,0) ? payout : 0;
    if(payout > 0) S.balance = Math.min(CONFIG.maxBalance, S.balance + payout);
    const h = S.history[p.game] = S.history[p.game] || [];
    h.unshift(Object.assign({}, info||{}, {bet:p.bet, payout}));
    if(h.length > 20) h.length = 20;
    this.roundDone(payout > p.bet, payout);      // статистика, задания, опыт, save()
    ui.pulse = payout > 0; refreshTop();
    return {bet:p.bet, payout};
  },
  roundDone(won, payout){
    S.stats.rounds++; if(won) S.stats.wins++;
    if(won && payout>S.stats.biggestWin) S.stats.biggestWin = payout;
    Quests.track("round"); this.addXp(10); save();
  },
  xpNeed(lvl){ return 100 + 50*(lvl-1); },
  addXp(n){
    if(!isInt(n,1)) return;
    S.xp += n; let up = false;
    while(S.xp >= this.xpNeed(S.level)){ S.xp -= this.xpNeed(S.level); S.level++; up = true; }
    if(up){ toast("🎉 Новый уровень: "+S.level); Sound.win(); }
    save();
  }
};
/* обновить баланс на экране без перерисовки (нужно во время анимаций) */
function refreshTop(){
  document.querySelectorAll(".bal span").forEach(e=>e.textContent = fmt(S.balance));
  document.querySelectorAll(".js-bal").forEach(e=>e.textContent = fmt(S.balance));
  const lv = document.querySelector(".who small"); if(lv) lv.textContent = "Уровень "+S.level;
  const b = document.querySelector(".bal");
  if(b && ui.pulse){ b.classList.remove("pulse"); void b.offsetWidth; b.classList.add("pulse"); }
  ui.pulse = false;
}

/* ---------- 4. Daily / Quests / Shop ---------- */
const Daily = {
  info(){
    const now = Date.now(), next = S.lastDaily + CONFIG.dailyCooldownMs;
    const avail = S.lastDaily===0 || now >= next;
    let streak = S.streak;
    if(avail){ streak = (S.lastDaily!==0 && now - S.lastDaily < CONFIG.dailyStreakResetMs) ? S.streak+1 : 1; }
    const day = Math.min(streak, CONFIG.dailyMaxStreak);
    return {avail, remain: Math.max(0, next-now), streak, reward: CONFIG.dailyBase + CONFIG.dailyStep*(day-1)};
  },
  claim(){
    const i = this.info(); if(!i.avail) return false;   // защита от повторного получения
    S.lastDaily = Date.now(); S.streak = i.streak;
    Economy.earn(i.reward); Economy.addXp(20); Quests.track("daily"); save();
    return i;
  }
};
const Quests = {
  ensure(){ if(S.quests.day !== todayKey()){ S.quests = {day:todayKey(), progress:{}, claimed:{}}; save(); } },
  def(id){ return QUESTS.find(q=>q.id===id); },
  track(id,n){ this.ensure(); const q=this.def(id); if(!q||S.quests.claimed[id]) return;
    S.quests.progress[id] = Math.min(q.goal, (S.quests.progress[id]||0) + (n||1)); save(); },
  claim(id){
    this.ensure(); const q=this.def(id); if(!q) return false;
    if(S.quests.claimed[id] || (S.quests.progress[id]||0) < q.goal) return false;
    S.quests.claimed[id] = true; Economy.earn(q.chips); Economy.addXp(q.xp); save(); return q;
  }
};
const Shop = {
  item(id){ return SHOP.find(x=>x.id===id); },
  buy(id){
    const it = this.item(id); if(!it || S.owned.includes(id)) return "no";
    if(!Economy.spend(it.price)) return "poor";
    S.stats.wagered -= it.price;   // покупка — не ставка
    S.owned.push(id); save(); return "ok";
  },
  equip(id){
    const it = this.item(id); if(!it || !S.owned.includes(id)) return false;
    S.equipped[it.type] = id; save(); return true;
  }
};

/* ---------- 5. Sound ---------- */
const Sound = {
  ctx:null, music:null,
  init(){ if(!this.ctx){ try{ const C = window.AudioContext||window.webkitAudioContext; if(C) this.ctx = new C(); }catch(e){} }
    if(this.ctx && this.ctx.state==="suspended") this.ctx.resume().catch(()=>{}); return !!this.ctx; },
  beep(f,d,type,vol){
    if(!S.settings.sound || !this.init()) return;
    try{ const c=this.ctx, o=c.createOscillator(), g=c.createGain(); o.type=type||"sine"; o.frequency.value=f;
      g.gain.setValueAtTime(vol||0.06,c.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+d);
      o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+d); }catch(e){}
  },
  click(){ this.beep(520,0.06,"triangle",0.05); },
  win(){ this.beep(660,0.12); setTimeout(()=>this.beep(880,0.12),110); setTimeout(()=>this.beep(1175,0.2),220); },
  error(){ this.beep(160,0.18,"sawtooth",0.05); },
  startMusic(){
    if(this.music || !S.settings.music || !this.init()) return;
    try{ const c=this.ctx, g=c.createGain(); g.gain.value=0.025; g.connect(c.destination);
      const oscs=[110,165,220.5].map(f=>{ const o=c.createOscillator(); o.type="sine"; o.frequency.value=f; o.connect(g); o.start(); return o; });
      this.music={g,oscs}; }catch(e){}
  },
  stopMusic(){ if(!this.music) return; try{ this.music.oscs.forEach(o=>o.stop()); this.music.g.disconnect(); }catch(e){} this.music=null; },
  syncMusic(){ S.settings.music ? this.startMusic() : this.stopMusic(); }
};
function haptic(kind){
  if(!S.settings.haptics) return;
  try{ if(tg && tg.HapticFeedback){ kind==="error" ? tg.HapticFeedback.notificationOccurred("error") : tg.HapticFeedback.impactOccurred("light"); }
       else if(navigator.vibrate) navigator.vibrate(kind==="error"?60:15); }catch(e){}
}

/* ==========================================================
   7. ИГРЫ
   Каждая игра — объект с html() / mount() / unmount() в GameViews.
   Деньги трогает ТОЛЬКО Economy.begin (списать ставку один раз)
   и Economy.settle (начислить выплату один раз).
   Результат раунда определяется ДО анимации и хранится в S.pending,
   поэтому его нельзя изменить задним числом, а если приложение закрыли
   во время раунда — он честно завершится при следующем запуске.
   ========================================================== */

/* ---------- Случайность (криптографическая, равномерная) ---------- */
const Rand = {
  int(n){            // целое 0..n-1 без смещения
    if(!(window.crypto && crypto.getRandomValues)) return Math.floor(Math.random()*n);
    const a = new Uint32Array(1), lim = Math.floor(4294967296/n)*n;
    do{ crypto.getRandomValues(a); }while(a[0] >= lim);
    return a[0] % n;
  },
  float(){           // число [0,1)
    if(!(window.crypto && crypto.getRandomValues)) return Math.random();
    const a = new Uint32Array(2); crypto.getRandomValues(a);
    return ((a[0]>>>5)*67108864 + (a[1]>>>6)) / 9007199254740992;
  }
};

/* ---------- Общие куски интерфейса ---------- */

/* ==========================================================
   СЛОТЫ — 3 барабана, одна линия
   Выплата = ставка × множитель комбинации.
   Три одинаковых символа — по таблице; ровно две 🍒 — возврат ставки (×1).
   ========================================================== */
const SLOT = {
  syms:[ {s:"🍒",w:30,p:5}, {s:"🍋",w:25,p:10}, {s:"🔔",w:18,p:25}, {s:"⭐",w:12,p:60}, {s:"💎",w:9,p:150}, {s:"7️⃣",w:6,p:500} ],
  pick(){ let r = Rand.int(100); for(const x of this.syms){ if(r < x.w) return x.s; r -= x.w; } return this.syms[0].s; },
  eval(res){
    if(res[0]===res[1] && res[1]===res[2]) return this.syms.find(x=>x.s===res[0]).p;
    if(res.filter(s=>s==="🍒").length === 2) return 1;
    return 0;
  }
};

/* ==========================================================
   CRASH
   Множитель m(t) = e^(0.1·t). Точка обвала выбирается при старте раунда
   (RTP ≈ 97%) и сохраняется в S.pending — игрок не может на неё повлиять.
   ========================================================== */
const Crash = {
  rate:0.1,
  mult(t){ return Math.exp(this.rate*t); },
  timeAt(m){ return Math.log(m)/this.rate; },
  newPoint(){ const r = Rand.float(); return Math.min(1000, Math.max(1, Math.floor(97/(1-r))/100)); },
  payout(bet,m){ return Math.floor(bet*Math.round(m*100)/100); },
  state(){
    const p = S.pending; if(!p || p.game!=="crash") return null;
    const t = Math.max(0, (Date.now()-p.startAt)/1000), tc = this.timeAt(p.crashPoint);
    if(p.auto && p.auto <= p.crashPoint && t >= this.timeAt(p.auto)) return {phase:"auto", mult:p.auto, t};
    if(t >= tc) return {phase:"crashed", mult:p.crashPoint, t:tc};
    return {phase:"running", mult:Math.floor(this.mult(t)*100)/100, t};
  },
  info(p, got){
    const c = p.crashPoint;
    return {b:"×"+c.toFixed(2), c:c>=2?"g":"r", d:got?("забрал ×"+got.toFixed(2)):("обвал ×"+c.toFixed(2)), m:got||0, crash:c};
  },
  _settle(payout, info){ const r = Economy.settle(payout, info); if(r) CrashView.onSettled(r, info); return r; },
  finishIfDone(){            // авто-вывод или обвал; безопасно вызывать много раз
    const st = this.state(); if(!st || st.phase==="running") return null;
    const p = S.pending;
    if(st.phase==="auto") return this._settle(this.payout(p.bet, st.mult), this.info(p, st.mult));
    return this._settle(0, this.info(p, 0));
  },
  cashOut(){
    const st = this.state(); if(!st) return null;
    if(st.phase!=="running") return this.finishIfDone();       // опоздали — раунд уже завершён
    const p = S.pending;
    return this._settle(this.payout(p.bet, st.mult), this.info(p, st.mult));
  }
};
const CrashView = {
  V:{raf:0, active:false, cv:null, ctx:null},
  html(){
    return `<div class="crashbox"><canvas id="crashCv" width="640" height="340"></canvas>
      <div class="cmult" id="cMult"><span id="cMultT">×1.00</span><small id="cSub">Сделайте ставку и нажмите «Старт»</small></div></div>
    <div class="resmsg" id="cMsg"></div>
    ${Bet.html()}
    <div class="card"><div class="autorow"><b>Авто-вывод на ×</b>
      <input class="autoin" id="crashAuto" type="text" inputmode="decimal" maxlength="7" placeholder="выкл" autocomplete="off"></div>
      <div class="sub" style="margin-top:6px">Необязательно: от 1.01 до 1000. Пусто — выводите вручную.</div></div>
    <button class="btn" id="cBtn" data-action="crashBtn">🚀 Старт</button>

  },
  mount(){
    const V = this.V; V.active = true; V.cv = $("#crashCv"); V.ctx = V.cv.getContext("2d");
    this.draw(0,1,false);

  },
  unmount(){ const V = this.V; V.active = false; cancelAnimationFrame(V.raf); }, // раунд продолжается «в фоне» по времени
  lock(on){ Bet.lock(on); const a = $("#crashAuto"); if(a) a.disabled = on; },
  press(){ (S.pending && S.pending.game==="crash") ? Crash.cashOut() : this.start(); },
  start(){
    if(S.pending) return;
    const bet = Bet.validate(); if(!bet) return;
    let auto = 0; const raw = ($("#crashAuto").value||"").trim().replace(",",".");
    if(raw){
      const a = Number(raw);
      if(!isFinite(a) || a < 1.01 || a > 1000){ toast("Авто-вывод: от 1.01 до 1000"); Sound.error(); return; }
      auto = Math.round(a*100)/100;
    }
    const crashPoint = Crash.newPoint();           // определено до старта
    if(!Economy.begin("crash", bet, {crashPoint, startAt:Date.now(), auto})){ Sound.error(); return; }
    gameMsg("#cMsg","");
    this.lock(true); this.loop();
  },
  loop(){
    const V = this.V; cancelAnimationFrame(V.raf); if(!V.active) return;
    const p = S.pending; if(!p || p.game!=="crash") return;
    const st = Crash.state();
    if(st.phase !== "running"){ Crash.finishIfDone(); return; }   // onSettled нарисует итог
    $("#cMult").className = "cmult";
    $("#cMultT").textContent = "×" + st.mult.toFixed(2);
    const pay = Crash.payout(p.bet, st.mult);
    $("#cSub").textContent = "Выплата сейчас: " + fmt(pay) + " RC" + (p.auto ? " · авто ×"+p.auto.toFixed(2) : "");
    const b = $("#cBtn"); b.textContent = "💰 Забрать " + fmt(pay) + " RC"; b.className = "btn";
    this.draw(st.t, st.mult, false);
    V.raf = requestAnimationFrame(()=>this.loop());
  },
  onSettled(res, info){
    const V = this.V; if(!V.active) return;
    cancelAnimationFrame(V.raf);
    const won = res.payout > 0;
    if(won){
      $("#cMult").className = "cmult won"; $("#cMultT").textContent = "×" + info.m.toFixed(2);
      $("#cSub").textContent = "Обвал был бы на ×" + info.crash.toFixed(2);
      gameMsg("#cMsg", `🎉 Забрали ×${info.m.toFixed(2)}: +${fmt(res.payout)} RC`, "win"); Sound.win(); haptic();
      this.draw(Crash.timeAt(info.m), info.m, false);
    }else{
      $("#cMult").className = "cmult crashed"; $("#cMultT").textContent = "×" + info.crash.toFixed(2);
      $("#cSub").textContent = "ОБВАЛ!";
      gameMsg("#cMsg", `💥 Обвал на ×${info.crash.toFixed(2)}: −${fmt(res.bet)} RC`, "lose"); Sound.error(); haptic("error");
      this.draw(Crash.timeAt(info.crash), info.crash, true);
    }
    this.lock(false);
    const b = $("#cBtn"); if(b){ b.textContent = "🚀 Старт"; b.className = "btn"; }
    const h = $("#hist"); if(h) h.innerHTML = histHtml("crash");
  },
  draw(t, m, crashed){
    const V = this.V, c = V.ctx; if(!c) return;
    const W = V.cv.width, H = V.cv.height, pad = 28;
    c.clearRect(0,0,W,H); c.fillStyle = "#0e0e12"; c.fillRect(0,0,W,H);
    c.strokeStyle = "rgba(255,255,255,.06)"; c.lineWidth = 1;
    for(let i=1;i<5;i++){ const y = pad + (H-2*pad)*i/5; c.beginPath(); c.moveTo(pad,y); c.lineTo(W-pad,y); c.stroke(); }
    if(t <= 0) return;
    const tmax = Math.max(8, t*1.12), ymax = Math.max(2, m*1.2), N = 70, pts = [];
    for(let i=0;i<=N;i++){
      const tt = t*i/N, mm = Crash.mult(tt);
      pts.push([pad + tt/tmax*(W-2*pad), H - pad - (mm-1)/(ymax-1)*(H-2*pad)]);
    }
    const col = crashed ? "#ff4d5e" : "#f5c542";
    c.beginPath(); pts.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));
    c.lineTo(pts[N][0],H-pad); c.lineTo(pts[0][0],H-pad); c.closePath();
    c.fillStyle = crashed ? "rgba(255,77,94,.12)" : "rgba(245,197,66,.12)"; c.fill();
    c.beginPath(); pts.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));
    c.strokeStyle = col; c.lineWidth = 5; c.lineJoin = "round"; c.shadowColor = col; c.shadowBlur = 14; c.stroke(); c.shadowBlur = 0;
    const e = pts[N]; c.beginPath(); c.arc(e[0],e[1],9,0,7); c.fillStyle = col; c.fill();
  }
};

/* ==========================================================
   ЕВРОПЕЙСКАЯ РУЛЕТКА (0–36, одно зеро)
   Выплаты: число 35:1, дюжина/колонка 2:1, цвет/чёт-нечет/1–18/19–36 1:1.
   Зеро проигрышное для всех внешних ставок.
   ========================================================== */
const ROU = {
  order:[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26],
  reds:[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36],
  names:{red:"красное",black:"чёрное",even:"чёт",odd:"нечёт",low:"1–18",high:"19–36",d1:"1–12",d2:"13–24",d3:"25–36",c1:"колонка 1",c2:"колонка 2",c3:"колонка 3"},
  color(n){ return n===0 ? "green" : (this.reds.includes(n) ? "red" : "black"); },
  valid(key){ return /^n:(\d|[12]\d|3[0-6])$/.test(key) || Object.prototype.hasOwnProperty.call(this.names, key); },
  /* сколько RC возвращается за 1 RC ставки (вместе со ставкой); 0 — проигрыш */
  ret(key, n){
    if(key.startsWith("n:")) return parseInt(key.slice(2),10) === n ? 36 : 0;
    if(n === 0) return 0;
    switch(key){
      case "red": return this.color(n)==="red" ? 2 : 0;
      case "black": return this.color(n)==="black" ? 2 : 0;
      case "even": return n%2===0 ? 2 : 0;
      case "odd": return n%2===1 ? 2 : 0;
      case "low": return n<=18 ? 2 : 0;
      case "high": return n>=19 ? 2 : 0;
      case "d1": return n<=12 ? 3 : 0;
      case "d2": return (n>=13 && n<=24) ? 3 : 0;
      case "d3": return n>=25 ? 3 : 0;
      case "c1": return n%3===1 ? 3 : 0;
      case "c2": return n%3===2 ? 3 : 0;
      case "c3": return n%3===0 ? 3 : 0;
    }
    return 0;
  }
};
function drawWheel(cv){
  const c = cv.getContext("2d"), W = cv.width, C = W/2, step = Math.PI*2/37;
  const R = C-2, Ro = R-14, Ri = R*0.66;
  c.clearRect(0,0,W,W);
  const g = c.createRadialGradient(C,C,Ri,C,C,R); g.addColorStop(0,"#8a6508"); g.addColorStop(1,"#f5c542");
  c.beginPath(); c.arc(C,C,R,0,7); c.fillStyle = g; c.fill();
  for(let i=0;i<37;i++){
    const n = ROU.order[i], a0 = -Math.PI/2 + i*step, a1 = a0 + step, col = ROU.color(n);
    c.beginPath(); c.arc(C,C,Ro,a0,a1); c.arc(C,C,Ri,a1,a0,true); c.closePath();
    c.fillStyle = col==="red" ? "#b3202e" : col==="black" ? "#141418" : "#12853f"; c.fill();
    c.strokeStyle = "#d9b24a"; c.lineWidth = 2; c.stroke();
    c.save(); c.translate(C,C); c.rotate(a0 + step/2 + Math.PI/2);
    c.fillStyle = "#fff"; c.font = "bold 25px sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
    c.fillText(String(n), 0, -(Ri + (Ro-Ri)/2)); c.restore();
  }
  const g2 = c.createRadialGradient(C,C,0,C,C,Ri); g2.addColorStop(0,"#1c1c22"); g2.addColorStop(1,"#0b0b0d");
  c.beginPath(); c.arc(C,C,Ri-2,0,7); c.fillStyle = g2; c.fill();
  c.strokeStyle = "#b8860b"; c.lineWidth = 4; c.stroke();
}
const RouletteView = {

  html(){
    const cell = (key, main, cls, sub)=>`<button class="rcell ${cls}" data-action="rbet" data-arg="${key}" data-key="${key}">${main}${sub?`<small>${sub}</small>`:""}<span class="cb"></span></button>`;
    let nums = ""; for(let r=0;r<12;r++) for(let c=1;c<=3;c++){ const n = r*3+c; nums += cell("n:"+n, n, ROU.color(n)); }
    return `<div class="wheelwrap">
        <div class="pointer"></div>
        <div class="wheelrot" id="wheelRot"><canvas id="wheelCv" width="640" height="640"></canvas></div>
        <div class="ballrot" id="ballRot"><div class="ball"></div></div>
        <div class="hub" id="hub"><span id="hubN">?</span></div>
      </div>
      <div class="resmsg" id="rMsg">Выберите фишку и ставьте на поле</div>
      <div id="hist">${histHtml("roulette")}</div>
      <h2 style="margin-top:14px">Ставки</h2>
      <div class="rg n3">${cell("red","Красное","red")}${cell("black","Чёрное","black")}${cell("even","Чёт","out")}</div>
      <div class="rg n3">${cell("odd","Нечёт","out")}${cell("low","1–18","out")}${cell("high","19–36","out")}</div>
      <div class="rg n3">${cell("d1","1–12","out","2:1")}${cell("d2","13–24","out","2:1")}${cell("d3","25–36","out","2:1")}</div>
      <div class="rg"><button class="rcell green" data-action="rbet" data-arg="n:0" data-key="n:0">0<small>35:1</small><span class="cb"></span></button></div>
      <div class="rg n3">${nums}</div>
      <div class="rg n3">${cell("c1","Колонка 1","out","2:1")}${cell("c2","Колонка 2","out","2:1")}${cell("c3","Колонка 3","out","2:1")}</div>
      <div class="rctl" id="rctl">
        <div class="row" style="margin-bottom:8px"><span>Поставлено: <b id="rTotal" style="color:var(--goldsoft);font-size:18px">0</b> RC</span><span>Баланс: <b class="js-bal" style="color:var(--goldsoft)">${fmt(S.balance)}</b></span></div>
        <div class="presets">${this.CHIPS.map(v=>`<button class="pbtn" data-action="rchip" data-arg="${v}" data-chip="${v}">${v}</button>`).join("")}</div>
        <div class="acts"><button class="pbtn" data-action="rundo" aria-label="Отменить последнюю">↩</button><button class="pbtn" data-action="rclear" aria-label="Очистить">✕</button><button class="pbtn" data-action="rrepeat" aria-label="Повторить прошлую ставку">⟳</button><button class="btn" id="rSpin" data-action="rspin">🎡 Крутить</button></div>
      </div>`;
  },
  mount(){
    const V = this.V; V.bets = {}; V.stack = []; V.busy = false; V.rot = 0; V.ballRot = 0; V.timer = 0;
    if(!this.CHIPS.includes(V.chip)) V.chip = 10;
    drawWheel($("#wheelCv")); this.refresh();
  },
  unmount(){
    const V = this.V; clearTimeout(V.timer); V.timer = 0; V.busy = false;
    const p = S.pending; if(p && p.game==="roulette") Economy.settle(p.payout, p.info);
  },
  total(){ return Object.values(this.V.bets).reduce((a,b)=>a+b,0); },
  refresh(){
    const V = this.V;
    document.querySelectorAll(".rcell[data-key]").forEach(el=>{
      const a = V.bets[el.dataset.key] || 0;
      el.classList.toggle("has", a>0); el.querySelector(".cb").textContent = a>0 ? fmtShort(a) : "";
    });
    document.querySelectorAll("[data-chip]").forEach(el=>el.classList.toggle("on", parseInt(el.dataset.chip,10)===V.chip));
    const t = $("#rTotal"); if(t) t.textContent = fmt(this.total());
    const rc = $("#rctl"); if(rc) rc.classList.toggle("locked", V.busy);
    document.querySelectorAll(".js-bal").forEach(e=>e.textContent = fmt(S.balance));
  },
  chip(v){ if(this.V.busy) return; v = parseInt(v,10); if(this.CHIPS.includes(v)){ this.V.chip = v; this.refresh(); } },
  place(key){
    const V = this.V; if(V.busy || S.pending || !ROU.valid(key)) return;
    if(this.total() + V.chip > S.balance){ toast("Не хватает RC"); Sound.error(); haptic("error"); return; }
    V.bets[key] = (V.bets[key]||0) + V.chip; V.stack.push({key, add:V.chip}); this.refresh();
  },
  undo(){
    const V = this.V; if(V.busy) return; const s = V.stack.pop(); if(!s) return;
    V.bets[s.key] -= s.add; if(V.bets[s.key] <= 0) delete V.bets[s.key]; this.refresh();
  },
  clear(){ const V = this.V; if(V.busy) return; V.bets = {}; V.stack = []; this.refresh(); },
  repeat(){
    const V = this.V; if(V.busy || S.pending) return;
    if(!V.last){ toast("Нет прошлой ставки"); return; }
    const sum = Object.values(V.last).reduce((a,b)=>a+b,0);
    if(sum > S.balance){ toast("Не хватает RC"); Sound.error(); return; }
    V.bets = Object.assign({}, V.last); V.stack = Object.entries(V.last).map(([key,add])=>({key,add})); this.refresh();
  },
  spin(){
    const V = this.V; if(V.busy || S.pending) return;
    const total = this.total();
    if(total < 1){ toast("Сделайте ставку"); Sound.error(); return; }
    if(total > S.balance){ toast("Не хватает RC"); Sound.error(); return; }
    const n = Rand.int(37);                                   // результат определён ДО анимации
    let payout = 0; for(const k in V.bets) payout += V.bets[k] * ROU.ret(k, n);
    if(!Economy.begin("roulette", total, {payout, info:{b:String(n), c:ROU.color(n), n}})){ Sound.error(); return; }
    V.busy = true; this.refresh();
    document.querySelectorAll(".rcell.hit").forEach(e=>e.classList.remove("hit"));
    gameMsg("#rMsg","Колесо вращается…");
    const hub = $("#hub"); hub.className = "hub"; $("#hubN").textContent = "?";
    const step = 360/37, idx = ROU.order.indexOf(n);
    const point = (idx + 0.5)*step + (Rand.float()-0.5)*step*0.7;      // точка внутри нужного кармана
    const d = (((-point) % 360) + 360) % 360, cur = ((V.rot % 360) + 360) % 360;
    V.rot += ((d - cur + 360) % 360) + 360*6; V.ballRot -= 360*4;
    const dur = S.settings.animations ? 5000 : 400;
    [$("#wheelRot"), $("#ballRot")].forEach(el=>el.style.transitionDuration = dur+"ms");
    $("#wheelRot").style.transform = `rotate(${V.rot}deg)`;
    $("#ballRot").style.transform = `rotate(${V.ballRot}deg)`;
    let tick = 0; const tk = setInterval(()=>{ if(++tick > 14 || !V.busy) clearInterval(tk); else Sound.beep(700,0.02,"square",0.015); }, 280);
    V.timer = setTimeout(()=>this.finish(), dur + 250);
  },
  finish(){
    const V = this.V; V.timer = 0;
    const p = S.pending; if(!p || p.game!=="roulette"){ V.busy = false; this.refresh(); return; }
    const n = p.info.n, bets = V.bets;
    const r = Economy.settle(p.payout, p.info);
    V.last = bets; V.bets = {}; V.stack = []; V.busy = false;
    const hub = $("#hub"); hub.className = "hub " + ROU.color(n); $("#hubN").textContent = n;
    Object.keys(bets).forEach(k=>{ if(ROU.ret(k,n) > 0){ const el = document.querySelector(`.rcell[data-key="${k}"]`); if(el) el.classList.add("hit"); } });
    const cname = {red:"красное",black:"чёрное",green:"зеро"}[ROU.color(n)];
    if(r){
      const net = r.payout - r.bet;
      if(net > 0){ gameMsg("#rMsg", `🎉 Выпало ${n} (${cname}). Выигрыш +${fmt(net)} RC`, "win"); Sound.win(); haptic(); }
      else if(net === 0){ gameMsg("#rMsg", `Выпало ${n} (${cname}). Ставка возвращена`, "win"); }
      else { gameMsg("#rMsg", `Выпало ${n} (${cname}). Проигрыш −${fmt(-net)} RC`, "lose"); }
    }
    $("#hist").innerHTML = histHtml("roulette"); this.refresh();
  }
};

const GameViews = { slots:SlotsView, crash:CrashView, roulette:RouletteView };

/* Раунд Crash идёт по времени, даже если вы ушли с экрана игры */
setInterval(()=>{ if(S.pending && S.pending.game==="crash") Crash.finishIfDone(); }, 250);

/* При запуске: если приложение закрыли посреди раунда — честно его завершаем */
function resolvePendingOnLoad(){
  const p = S.pending; if(!p) return;
  let r = null;
  if(p.game==="crash") r = Crash.finishIfDone();
  else r = Economy.settle(p.payout, p.info);
  if(r) toast(r.payout > 0 ? `Незавершённый раунд: +${fmt(r.payout)} RC` : "Незавершённый раунд завершён");
}

/* один обработчик на все кнопки; защита от двойных нажатий */
document.addEventListener("input", e=>{ if(e.target.id==="betInput") e.target.value = e.target.value.replace(/\D/g,"").slice(0,9); if(e.target.id==="crashAuto") e.target.value = e.target.value.replace(/[^0-9.,]/g,"").slice(0,7); });
document.addEventListener("change", e=>{ if(e.target.id==="betInput"){ const v = Bet.get(); if(v){ S.lastBet = Math.min(v,999999999); save(); } } });
let lastTap = 0;
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-action]");
  if(!el || el.disabled) return;
  const now = Date.now(); if(now - lastTap < 90) return; lastTap = now;
  const fn = Actions[el.dataset.action]; if(!fn) return;
  Sound.click(); haptic();
  try{ fn(el.dataset.arg); }catch(err){ console.error(err); toast("Ошибка, попробуйте ещё раз"); }
});

/* таймер ежедневной награды */
setInterval(()=>{
  const t = $("#dailyTimer"); if(!t || ui.view!=="home") return;
  const left = Daily.info().remain;
  if(left<=0){ render(); return; }
  t.textContent = fmtTime(left);
}, 1000);

/* старт */
try{
  if(tg){ tg.ready(); tg.expand(); try{ tg.setHeaderColor("#0b0b0d"); tg.setBackgroundColor("#0b0b0d"); }catch(e){} try{ tg.disableVerticalSwipes && tg.disableVerticalSwipes(); }catch(e){} }
}catch(e){}
save();
resolvePendingOnLoad();
render();
document.addEventListener("pointerdown", ()=>Sound.syncMusic(), {once:true});
</script>
